<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta
      name="description"
      content="Unofficial BCA question-paper pattern explorer for Calicut University students. See what keeps coming back in exams. Not affiliated with the university."
    />
    <title>BCA Question Explorer</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BCA Question Explorer" />
    <meta
      property="og:description"
      content="See which BCA exam questions keep coming back. Unofficial Calicut University student resource."
    />
    <meta property="og:image" content="./pwa-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="BCA Question Explorer" />
    <meta
      name="twitter:description"
      content="See which BCA exam questions keep coming back. Unofficial Calicut University student resource."
    />
    <meta name="twitter:image" content="./pwa-512.png" />
    <script>
      // Apply saved theme before paint to avoid a flash.
      try {
        var t = localStorage.getItem('bca.theme.v2')
        var theme = t === 'light' || t === 'dark' ? t : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
